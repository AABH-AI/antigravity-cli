name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', 3.11]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Test CLI
      run: |
        antigravity --version
        antigravity --help
        antigravity google setup --help
        antigravity drive --help
        antigravity info device
        antigravity info storage
    
    - name: Test imports
      run: |
        python -c "from antigravity import __version__; print(f'Version: {__version__}')"
        python -c "from antigravity.cli import AntiGravityCLI; print('CLI OK')"
        python -c "from antigravity.google_auth import GoogleAuthManager; print('Auth OK')"
        python -c "from antigravity.google_drive import GoogleDriveManager; print('Drive OK')"
        python -c "from antigravity.termux_utils import TermuxUtils; print('Utils OK')"
    
    - name: Lint
      run: |
        python -m py_compile antigravity/*.py || true
